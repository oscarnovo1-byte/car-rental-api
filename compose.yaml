services:
  car-rental-api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: car-rental-api

    ports:
      - "8080:8080"

    environment:
      ConnectionStrings__DefaultConnection: "Data Source=/data/car-rental.db"

    volumes:
      - car-rental-data:/data

volumes:
  car-rental-data: